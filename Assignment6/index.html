<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý người dùng</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      function App() {
        const [kw, setKeyword] = React.useState("");
        const [newUser, setNewUser] = React.useState(null);

        return (
          <div>
            <h1>Quản lý người dùng</h1>
            <SearchForm onChangeValue={setKeyword} />
            <AddUser onAdd={setNewUser} />
            <ResultTable
              keyword={kw}
              user={newUser}
              onAdded={() => setNewUser(null)}
            />
          </div>
        );
      }

      function SearchForm({ onChangeValue }) {
        return (
          <input
            type="text"
            placeholder="Nhập tên hoặc người dùng"
            onChange={(e) => onChangeValue(e.target.value)}
          />
        );
      }

      function ResultTable({ keyword, user, onAdded }) {
        const [users, setUsers] = React.useState([]);
        const [loading, setLoading] = React.useState(true);
        const [editing, setEditing] = React.useState(null);

        // Tải dữ liệu 1 lần trước khi component mount
        React.useEffect(() => {
          fetch("https://jsonplaceholder.typicode.com/users")
            .then((res) => res.json())
            .then((data) => {
              setUsers(data);
              setLoading(false);
            });
        }, []);

        // Cập nhật thêm dữ liệu mỗi khi có user mới được nhập vào
        React.useEffect(() => {
          if (user) {
            setUsers((prev) => [...prev, { ...user, id: prev.length + 1 }]);
            onAdded();
          }
        }, [user]);

        // Hàm kích hoạt form Sửa (Deep Copy)
        const editUser = (userToEdit) => {
          setEditing({ ...userToEdit, address: { ...userToEdit.address } });
        };

        // Hàm cập nhật state editing khi gõ vào form sửa
        const handleEditChange = (id, value) => {
          if (["street", "suite", "city"].includes(id)) {
            setEditing({
              ...editing,
              address: { ...editing.address, [id]: value }
            });
          } else {
            setEditing({ ...editing, [id]: value });
          }
        };

        // Hàm lưu sau khi chỉnh sửa
        const saveUser = () => {
          setUsers((prev) =>
            prev.map((u) => (u.id === editing.id ? editing : u))
          );
          setEditing(null);
        };

        // Hàm xóa người dùng
        const removeUser = (id) => {
          setUsers((prev) => prev.filter((u) => u.id !== id));
        };

        // Lọc theo keyword cho chức năng tìm kiếm
        const filteredUsers = users.filter(
          (u) =>
            u.name.toLowerCase().includes(keyword.toLowerCase()) ||
            u.username.toLowerCase().includes(keyword.toLowerCase()),
        );

        if (loading) return <p>Đang tải dữ liệu...</p>;

        return (
          <div>
            <table border="1">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Username</th>
                  <th>Email</th>
                  <th>Address</th>
                  <th>Phone</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {filteredUsers.map((u) => (
                  <tr key={u.id}>
                    <td>{u.id}</td>
                    <td>{u.name}</td>
                    <td>{u.username}</td>
                    <td>{u.email}</td>
                    <td>
                      {u.address.street}, {u.address.suite}, {u.address.city}
                    </td>
                    <td>{u.phone}</td>
                    <td>
                      <button onClick={() => editUser(u)}>Sửa</button>
                      <button onClick={() => removeUser(u.id)}>Xóa</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>

            {editing && (
              <div>
                <h4>Sửa</h4>
                <label htmlFor="name"> Name </label>
                <input
                  id="name"
                  type="text"
                  value={editing.name}
                  onChange={(e) => handleEditChange("name", e.target.value)}
                />

                <br />

                <label htmlFor="username"> Username </label>
                <input
                  id="username"
                  type="text"
                  value={editing.username}
                  onChange={(e) => handleEditChange("username", e.target.value)}
                />

                <br />

                <label htmlFor="email"> Email </label>
                <input
                  id="email"
                  type="text"
                  value={editing.email}
                  onChange={(e) => handleEditChange("email", e.target.value)}
                />

                <br/> <br/>
                <button onClick={saveUser}>Lưu</button>
                <button onClick={() => setEditing(null)}>Hủy</button>
              </div>
            )}
          </div>
        );
      }

      function AddUser({ onAdd }) {
        const [adding, setAdding] = React.useState(false);
        const [user, setUser] = React.useState({
          name: "",
          username: "",
          email: "",
          address: { street: "", suite: "", city: "" },
          phone: "",
          website: "",
        });

        const handleChange = (e) => {
          const { id, value } = e.target;
          if (["street", "suite", "city"].includes(id)) {
            setUser({ ...user, address: { ...user.address, [id]: value } });
          } else {
            setUser({ ...user, [id]: value });
          }
        };

        const handleAdd = () => {
          if (user.name === "" || user.username === "") {
            alert("Vui lòng nhập Name và Username!");
            return;
          }
          onAdd(user);
          setUser({
            name: "",
            username: "",
            email: "",
            address: { street: "", suite: "", city: "" },
            phone: "",
            website: "",
          });
          setAdding(false);
        };

        return (
          <div>
            <button onClick={() => setAdding(true)}>Thêm</button>
            {adding && (
              <div>
                <div>
                  <h4>Thêm người dùng</h4>
                  <label htmlFor="name"> Name: </label>
                  <input
                    id="name"
                    type="text"
                    value={user.name}
                    onChange={handleChange}
                  />

                  <br />

                  <label htmlFor="username"> Username: </label>
                  <input
                    id="username"
                    type="text"
                    value={user.username}
                    onChange={handleChange}
                  />

                  <br /> <br />
                  <button onClick={handleAdd}>Thêm</button>
                  <button onClick={() => setAdding(false)}>Hủy</button>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
